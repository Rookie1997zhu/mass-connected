<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Hello Box</title>
  <defs>
    <linearGradient id="hbFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a066"/>
      <stop offset="1" stop-color="#b97f3d"/>
    </linearGradient>
    <linearGradient id="hbSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c08e4d"/>
      <stop offset="1" stop-color="#9c6a2f"/>
    </linearGradient>
    <linearGradient id="hbTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eab97a"/>
      <stop offset="1" stop-color="#d9a066"/>
    </linearGradient>
  </defs>
  <!-- closed box: top, front, side -->
  <polygon points="28,8 46,16 28,24 10,16"
           fill="url(#hbTop)" stroke="#7a521f" stroke-width="1.5"
           stroke-linejoin="round"/>
  <polygon points="10,16 28,24 28,50 10,42"
           fill="url(#hbFront)" stroke="#7a521f" stroke-width="1.5"
           stroke-linejoin="round"/>
  <polygon points="46,16 28,24 28,50 46,42"
           fill="url(#hbSide)" stroke="#7a521f" stroke-width="1.5"
           stroke-linejoin="round"/>
  <line x1="28" y1="24" x2="28" y2="50"
        stroke="#7a521f" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- "create" plus badge -->
  <circle cx="50" cy="48" r="12" fill="#4a8a3f" stroke="#2f5e28" stroke-width="1.5"/>
  <path d="M50 42 V54 M44 48 H56" stroke="#ffffff" stroke-width="3"
        stroke-linecap="round"/>
</svg>

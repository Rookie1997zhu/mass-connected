<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Generate Dieline</title>
  <!-- flat blank background -->
  <rect x="6" y="20" width="52" height="24" rx="1.5"
        fill="#e3b577" stroke="#7a521f" stroke-width="1.5"/>
  <!-- top flaps -->
  <rect x="6" y="10" width="46" height="10" fill="#eab97a"
        stroke="#b00000" stroke-width="1.4"/>
  <!-- bottom flaps -->
  <rect x="6" y="44" width="46" height="10" fill="#eab97a"
        stroke="#b00000" stroke-width="1.4"/>
  <!-- vertical crease lines (blue dashed) -->
  <g stroke="#1438c8" stroke-width="1.3" stroke-dasharray="3,2">
    <line x1="17.5" y1="20" x2="17.5" y2="44"/>
    <line x1="29"   y1="20" x2="29"   y2="44"/>
    <line x1="40.5" y1="20" x2="40.5" y2="44"/>
    <line x1="52"   y1="20" x2="52"   y2="44"/>
  </g>
  <!-- horizontal crease lines (blue dashed) -->
  <g stroke="#1438c8" stroke-width="1.3" stroke-dasharray="3,2">
    <line x1="6" y1="20" x2="52" y2="20"/>
    <line x1="6" y1="44" x2="52" y2="44"/>
  </g>
  <!-- flap separation slits (red cut) -->
  <g stroke="#b00000" stroke-width="1.3">
    <line x1="17.5" y1="10" x2="17.5" y2="20"/>
    <line x1="29"   y1="10" x2="29"   y2="20"/>
    <line x1="40.5" y1="10" x2="40.5" y2="20"/>
    <line x1="17.5" y1="44" x2="17.5" y2="54"/>
    <line x1="29"   y1="44" x2="29"   y2="54"/>
    <line x1="40.5" y1="44" x2="40.5" y2="54"/>
  </g>
</svg>

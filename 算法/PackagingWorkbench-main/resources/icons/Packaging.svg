<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Packaging</title>
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a066"/>
      <stop offset="1" stop-color="#b97f3d"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c08e4d"/>
      <stop offset="1" stop-color="#9c6a2f"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eab97a"/>
      <stop offset="1" stop-color="#d9a066"/>
    </linearGradient>
  </defs>
  <!-- open flaps -->
  <polygon points="32,12 50,20 32,28 14,20"
           fill="#f0c48a" stroke="#7a521f" stroke-width="1.5"
           stroke-linejoin="round"/>
  <polygon points="32,12 14,20 14,8 32,1"
           fill="#e3b577" stroke="#7a521f" stroke-width="1.5"
           stroke-linejoin="round"/>
  <polygon points="32,12 50,20 50,8 32,1"
           fill="#d6a566" stroke="#7a521f" stroke-width="1.5"
           stroke-linejoin="round"/>
  <!-- box body -->
  <polygon points="14,20 32,28 32,54 14,46"
           fill="url(#front)" stroke="#7a521f" stroke-width="1.5"
           stroke-linejoin="round"/>
  <polygon points="50,20 32,28 32,54 50,46"
           fill="url(#side)" stroke="#7a521f" stroke-width="1.5"
           stroke-linejoin="round"/>
  <!-- center crease line on the body -->
  <line x1="32" y1="28" x2="32" y2="54"
        stroke="#7a521f" stroke-width="1" stroke-dasharray="2,2"/>
</svg>

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-oem_db}
      MYSQL_USER: ${MYSQL_USER:-oem_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-oem_pass}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: oemco-backend
    build: ./backend
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_CELERY_URL: ${REDIS_CELERY_URL:-redis://redis:6379/1}
      REDIS_CHANNELS_URL: ${REDIS_CHANNELS_URL:-redis://redis:6379/2}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      PRUSA_SLICER_PATH: ${PRUSA_SLICER_PATH:-/usr/local/bin/prusa-slicer}
    volumes:
      - ./backend:/app
      - media_data:/app/media
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # HTTP API；海量 WebSocket 由 chat-ws 承担，便于水平扩展
    command: ["sh", "/app/scripts/start_api.sh"]
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

  # 聊天 WebSocket 专用进程；生产可 docker compose up --scale chat-ws=N
  chat-ws:
    image: oemco-backend
    build: ./backend
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_CELERY_URL: ${REDIS_CELERY_URL:-redis://redis:6379/1}
      REDIS_CHANNELS_URL: ${REDIS_CHANNELS_URL:-redis://redis:6379/2}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    volumes:
      - ./backend:/app
      - media_data:/app/media
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: ["sh", "/app/scripts/start_chat_ws.sh"]
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    expose:
      - "8001"

  # PrusaSlicer 切片 Worker（AGPL）；与 backend 共享 media 卷
  slicer-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.slicer-worker
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_CELERY_URL: ${REDIS_CELERY_URL:-redis://redis:6379/1}
      REDIS_CHANNELS_URL: ${REDIS_CHANNELS_URL:-redis://redis:6379/2}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      PRUSA_SLICER_PATH: /usr/local/bin/prusa-slicer
      DB_HOST: mysql
    volumes:
      - ./backend:/app
      - media_data:/app/media
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    command: celery -A config worker -l info -c 1

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    command: npm run dev -- --host 0.0.0.0 --port 5173

  admin:
    build: ./admin
    volumes:
      - ./admin:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
      VITE_ADMIN_BASE_PATH: ${VITE_ADMIN_BASE_PATH:-/admin}
    command: npm run dev -- --host 0.0.0.0 --port 5174

  caddy:
    image: caddy:2-alpine
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - media_data:/media
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - chat-ws
      - frontend
      - admin

volumes:
  mysql_data:
  media_data:
  caddy_data:
  caddy_config:
